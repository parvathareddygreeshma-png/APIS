<!DOCTYPE html>
<html>
<head>

<title>House Price Prediction</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Regression Based House Price Prediction</h1>

<form action="/predict" method="post">

<label>Enter House Size (sqft)</label>

<input type="number" name="size" placeholder="Example: 1500" required>

<button type="submit">Predict Price</button>

</form>

<h2>{{ prediction_text }}</h2>
<h3>{{ mse }}</h3>
<h3>{{ r2 }}</h3>

</div>

</body>
</html>
